  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="600" height="800" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="599" height="799" fill="none" stroke="rgba(255,255,255,0.08)"/>
