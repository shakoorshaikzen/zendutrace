<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 736" font-family="ui-monospace,Menlo,monospace">
  <!-- Placeholder for the XenAuth platform capture: a drawn schematic of the
       authentication record, NOT a fabricated screenshot. Swap for a real
       platform capture when one is approved. -->
  <rect width="1024" height="736" fill="#101013"/>
  <defs>
    <pattern id="pd" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>
  <rect width="1024" height="736" fill="url(#pd)"/>
  <text x="64" y="84" font-size="17" letter-spacing="3" fill="rgba(255,255,255,0.45)">AUTHENTICATION RECORD &#183; SCHEMATIC</text>
  <!-- the tag -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linejoin="round">
    <rect x="76" y="220" width="204" height="284" rx="20"/>
    <path d="M112 276 h108 M112 316 h76" stroke-width="2.4" opacity="0.7"/>
  </g>
  <g stroke="#2DD4BF" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M150 430 a30 30 0 0 1 30 18"/>
    <path d="M136 460 a52 52 0 0 1 52 30"/>
  </g>
  <circle cx="196" cy="486" r="8" fill="#2DD4BF"/>
  <!-- tap arcs travelling to the record -->
  <path d="M300 362 q90 0 132 0" stroke="rgba(45,212,191,0.5)" stroke-width="3" stroke-dasharray="4 12" fill="none" stroke-linecap="round"/>
  <!-- the record: abstract event rows, bars not legible text -->
  <g>
    <rect x="452" y="180" width="496" height="376" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <text x="484" y="232" font-size="15" letter-spacing="2.5" fill="rgba(255,255,255,0.45)">EVENTS &#183; ONE SERIAL</text>
    <g fill="rgba(255,255,255,0.2)">
      <rect x="484" y="266" width="228" height="12" rx="6"/>
      <rect x="484" y="322" width="300" height="12" rx="6"/>
      <rect x="484" y="378" width="192" height="12" rx="6"/>
      <rect x="484" y="490" width="256" height="12" rx="6"/>
    </g>
    <rect x="484" y="434" width="336" height="12" rx="6" fill="rgba(45,212,191,0.55)"/>
    <g fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round">
      <path d="M896 268 l7 8 12 -14"/>
      <path d="M896 324 l7 8 12 -14"/>
      <path d="M896 380 l7 8 12 -14"/>
      <path d="M896 436 l7 8 12 -14"/>
      <path d="M896 492 l7 8 12 -14"/>
    </g>
    <line x1="484" y1="300" x2="916" y2="300" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
    <line x1="484" y1="356" x2="916" y2="356" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
    <line x1="484" y1="412" x2="916" y2="412" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
    <line x1="484" y1="468" x2="916" y2="468" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  </g>
  <text x="64" y="668" font-size="14" letter-spacing="2" fill="rgba(255,255,255,0.35)">TAP &#8594; VERIFY &#8594; WRITE &#183; EVERY EVENT UNDER THE ITEM'S OWN SERIAL</text>
</svg>
